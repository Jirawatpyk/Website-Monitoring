name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main: it may be applying production migrations.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Placeholders so the build and signed-out e2e checks run without a database. Never real keys.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
    steps:
      # Actions are pinned to commit SHAs; Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm version comes from package.json "packageManager" (pnpm 12 needs action-setup >= v6.1.0).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm plan:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage # unit + integration tests with per-package coverage thresholds
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm build
      - run: pnpm --filter @dxt/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        timeout-minutes: 8
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  # Database tests: build the schema from every migration + seed on a local Supabase stack in
  # Docker, then run the pgTAP tests in supabase/tests (RLS, grants, sign-up hook, audit_log).
  # Required on main alongside `check` (pnpm pr:merge, D-008). No secrets: local stack only.
  # Then: committed DB types must match the migrations, the server integration tests run, and the
  # signed-in e2e flows (Google can't be scripted, so test users sign in with a password on this
  # local stack only) run against it.
  db:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      ALLOWED_EMAIL_DOMAIN: example.test
      E2E_LOCAL_SUPABASE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Postgres, Auth, REST, Storage and the API gateway: pgTAP, the signed-in e2e flows and the
      # verifier / housekeeping int tests on real Storage (S03).
      - run: pnpm exec supabase start -x studio,imgproxy,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta,mailpit
      - run: pnpm db:test
      - name: DB types match the migrations
        run: |
          pnpm db:types
          git diff --exit-code packages/db/src/database.types.ts || {
            echo "::error::packages/db/src/database.types.ts is stale — run pnpm db:reset && pnpm db:types and commit it"
            exit 1
          }
      # The local stack's own keys (CLI demo values, not secrets) for the app and the e2e helper.
      - name: Local Supabase keys
        run: |
          pnpm exec supabase status -o env | sed -n \
            -e 's/^PUBLISHABLE_KEY="\(.*\)"$/NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=\1/p' \
            -e 's/^SECRET_KEY="\(.*\)"$/E2E_SUPABASE_SECRET_KEY=\1\nSUPABASE_SERVICE_ROLE_KEY=\1/p' >> "$GITHUB_ENV"
      # Engine + notifier against the real tables and SQL functions (S02a Done-when 3).
      - run: pnpm --filter @dxt/web test:int
      - run: pnpm --filter @dxt/web build
      - run: pnpm --filter @dxt/web exec playwright install --with-deps chromium
      # Every spec: the signed-in flows (sites, ack, incident, escalation, maintenance…) skip without
      # E2E_LOCAL_SUPABASE, so before they never ran anywhere but a developer's machine (S09 review).
      - name: Signed-in e2e (local Supabase)
        run: pnpm --filter @dxt/web exec playwright test
        timeout-minutes: 10
        # The server's full env, so an ack's held messages flush as in production (no Chat webhook or
        # Resend here: nothing leaves the runner). Throwaway values for this local stack, not secrets.
        env:
          CRON_SECRET: ci-local-cron-secret-not-a-real-one-0000
          INGEST_TOKEN: ci-local-ingest-token-not-a-real-one-000
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report-db
          path: apps/web/playwright-report
          retention-days: 7

  # Production migrations are applied here and only here, after a PR is merged to main
  # (docs/workflow.md → Environments). Skips until the production project and its secret exist.
  # SUPABASE_PROD_DB_URL is a repository secret: environment secrets are ignored on a private repo
  # on GitHub Free (D-008). Only this job reads it, and only on pushes to main.
  migrate-production:
    needs: [check, db]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: migrate-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations to production
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        run: |
          if [ -z "$SUPABASE_PROD_DB_URL" ]; then
            echo "SUPABASE_PROD_DB_URL is not set yet — skipping."
            exit 0
          fi
          pnpm exec supabase db push --db-url "$SUPABASE_PROD_DB_URL"
